<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Администрация – Пчелари България</title>
  <style>
    :root { --bg:#140a05; --card:#1f1109; --gold:#f59e0b; --text:#faf4eb; --muted:#b8a999; --ok:#34d399; --bad:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; justify-content:space-between; align-items:center; padding:14px 24px; background:#0b0503; border-bottom:1px solid #3a2415; }
    header h1 { font-size:1.1rem; margin:0; color:var(--gold); }
    a { color:var(--gold); }
    main { padding:20px 24px; max-width:1200px; margin:0 auto; }
    nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
    button { cursor:pointer; border:1px solid var(--gold); background:transparent; color:var(--gold); padding:6px 12px; border-radius:8px; font-size:.85rem; }
    button.primary, nav button.active { background:var(--gold); color:#140a05; }
    button.danger { border-color:var(--bad); color:var(--bad); }
    button.ok { border-color:var(--ok); color:var(--ok); }
    input, select, textarea { background:#0b0503; color:var(--text); border:1px solid #3a2415; border-radius:8px; padding:7px 10px; font:inherit; }
    table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; font-size:.88rem; }
    th, td { text-align:left; padding:9px 12px; border-bottom:1px solid #2e1b10; vertical-align:top; }
    th { color:var(--gold); font-weight:600; background:#180d07; }
    .login { max-width:340px; margin:80px auto; background:var(--card); padding:26px; border-radius:14px; display:grid; gap:12px; }
    .msg { margin:10px 0; min-height:1.2em; color:var(--muted); }
    .msg.err { color:var(--bad); } .msg.good { color:var(--ok); }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
    .badge { padding:2px 8px; border-radius:10px; font-size:.75rem; background:#3a2415; }
    dialog { background:var(--card); color:var(--text); border:1px solid var(--gold); border-radius:14px; max-width:640px; width:92%; }
    dialog::backdrop { background:rgba(0,0,0,.6); }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .grid2 label { display:grid; gap:4px; font-size:.8rem; color:var(--muted); }
    .grid2 .full { grid-column:1/-1; }
  </style>
</head>
<body>
<header>
  <h1>🐝 Пчелари България – Администрация</h1>
  <div><a href="/">← Към сайта</a> <button id="logout-btn" style="display:none;margin-left:12px">Изход</button></div>
</header>
<main>
  <section id="login-view" class="login" style="display:none">
    <h2 style="margin:0">Вход</h2>
    <input id="username" placeholder="Потребител" autocomplete="username">
    <input id="password" type="password" placeholder="Парола" autocomplete="current-password">
    <button class="primary" id="login-btn">Влез</button>
    <div id="login-msg" class="msg err"></div>
  </section>

  <section id="app-view" style="display:none">
    <nav id="tabs">
      <button data-tab="applications" class="active">Заявки за пчелари</button>
      <button data-tab="products">Продукти</button>
      <button data-tab="orders">Поръчки</button>
      <button data-tab="reviews">Отзиви</button>
      <button data-tab="promocodes">Промо кодове</button>
    </nav>
    <div id="msg" class="msg"></div>
    <div id="content"></div>
  </section>
</main>

<dialog id="product-dialog">
  <form method="dialog" id="product-form">
    <h3 id="product-dialog-title" style="margin-top:0">Продукт</h3>
    <div class="grid2">
      <label>Пчелар (ID)<input name="beekeeperId" type="number" min="1" required></label>
      <label>Тип<select name="type"><option>Мед</option><option>Пчелен прашец</option></select></label>
      <label class="full">Име<input name="name" required></label>
      <label>Категория<input name="category" required placeholder="manov, acacia, herbal, lavender, linden, pollen"></label>
      <label>Произход<input name="origin" required></label>
      <label>Етикет<input name="tag"></label>
      <label>Снимка<input name="image" placeholder="./images/acacia.jpg"></label>
      <label>Реколта<input name="harvestDate"></label>
      <label>Качество<input name="purity"></label>
      <label>Цвят<input name="color"></label>
      <label>Аромат<input name="aroma"></label>
      <label>Кристализация<input name="crystallization"></label>
      <label class="full">Вкусови нотки<input name="tastingNotes"></label>
      <label class="full">Описание<textarea name="description" rows="3"></textarea></label>
      <label class="full">Тагове за въпросника (със запетая)<input name="quizTags" placeholder="immunity,herbal"></label>
      <label class="full">Опаковки (по една на ред: Етикет | тегло | цена)
        <textarea name="variants" rows="3" placeholder="Буркан 0.9 кг | 0.9kg | 12.27" required></textarea></label>
      <label><span><input type="checkbox" name="inStock" checked> В наличност</span></label>
    </div>
    <div class="row" style="margin-top:14px"><button class="primary" value="save" id="product-save">Запази</button><button value="cancel" formnovalidate>Откажи</button></div>
  </form>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => new Date(d).toLocaleString('bg-BG');
let tab = 'applications', editingProductId = null;

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, { headers: {'Content-Type':'application/json'}, ...opts });
  let data = null; try { data = await res.json(); } catch {}
  if ((res.status === 401 || res.status === 403) && path !== '/auth/login') { showLogin(); throw new Error('Нужен е вход.'); }
  if (!res.ok) throw new Error((data && (data.errors ? Object.values(data.errors).flat().join(' ') : data.title || data.message)) || ('Грешка ' + res.status));
  return data;
}
function say(text, cls = '') { const m = $('#msg'); m.textContent = text; m.className = 'msg ' + cls; }
function showLogin() { $('#login-view').style.display = 'grid'; $('#app-view').style.display = 'none'; $('#logout-btn').style.display = 'none'; }
function showApp() { $('#login-view').style.display = 'none'; $('#app-view').style.display = 'block'; $('#logout-btn').style.display = 'inline-block'; load(); }

$('#login-btn').onclick = async () => {
  try {
    await api('/auth/login', { method:'POST', body: JSON.stringify({ username: $('#username').value, password: $('#password').value }) });
    $('#password').value = ''; $('#login-msg').textContent = ''; showApp();
  } catch (e) { $('#login-msg').textContent = e.message; }
};
$('#password').addEventListener('keydown', e => { if (e.key === 'Enter') $('#login-btn').click(); });
$('#logout-btn').onclick = async () => { await fetch('/api/auth/logout', { method:'POST' }); showLogin(); };
$('#tabs').onclick = e => { const b = e.target.closest('button[data-tab]'); if (!b) return;
  tab = b.dataset.tab; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === b)); load(); };

async function act(fn, ok) { try { await fn(); say(ok, 'good'); } catch (e) { say(e.message, 'err'); } load(); }

async function load() {
  say(''); const c = $('#content');
  try {
    if (tab === 'applications') {
      const rows = await api('/admin/applications');
      c.innerHTML = `<table><tr><th>Дата</th><th>Пчелар</th><th>Пчелин / БАБХ</th><th>Регион</th><th>Контакт</th><th>Предлага</th><th>Статус</th><th></th></tr>` +
        rows.map(a => `<tr><td>${fmtDate(a.submittedAt)}</td><td>${esc(a.fullName)}</td><td>${esc(a.apiaryName)}<br><small>${esc(a.registrationNumber)}</small></td>
        <td>${esc(a.region)}<br><small>${esc(a.cityOrVillage)}</small></td><td>${esc(a.phone)}<br><small>${esc(a.email)}</small></td>
        <td>${a.offersHoney ? '🍯' : ''} ${a.offersPollen ? '🌼' : ''}<br><small>${a.hiveCount} кошера</small></td><td><span class="badge">${esc(a.status)}</span></td>
        <td>${a.status === 'В обработка' ? `<button class="ok" data-approve="${a.id}">Одобри</button> <button class="danger" data-reject="${a.id}">Откажи</button>` : ''}</td></tr>`).join('') + `</table>`;
      c.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => act(() => api(`/admin/applications/${b.dataset.approve}/approve`, {method:'POST'}), 'Заявката е одобрена, пчеларят е публикуван.'));
      c.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => act(() => api(`/admin/applications/${b.dataset.reject}/reject`, {method:'POST'}), 'Заявката е отхвърлена.'));
    } else if (tab === 'products') {
      const rows = await api('/admin/products'); window._products = rows;
      c.innerHTML = `<div class="row"><button class="primary" id="new-product">+ Нов продукт</button></div><table><tr><th>ID</th><th>Продукт</th><th>Пчелар</th><th>Опаковки</th><th>Наличен</th><th></th></tr>` +
        rows.map(p => `<tr><td>${p.id}</td><td>${esc(p.name)}<br><small>${esc(p.type)} · ${esc(p.category)}</small></td><td>${p.beekeeper ? esc(p.beekeeper.apiaryName) + ' (#' + p.beekeeper.id + ')' : ''}</td>
        <td>${p.variants.map(v => esc(v.label) + ' – ' + Number(v.price).toFixed(2) + ' €').join('<br>')}</td><td>${p.inStock ? 'Да' : 'Не'}</td>
        <td><button data-edit="${p.id}">Редактирай</button> <button class="danger" data-del="${p.id}">Изтрий</button></td></tr>`).join('') + `</table>`;
      $('#new-product').onclick = () => openProduct(null);
      c.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openProduct(window._products.find(p => p.id == b.dataset.edit)));
      c.querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirm('Да се изтрие ли продуктът? (Ако има поръчки, само ще бъде скрит.)') && act(() => api(`/admin/products/${b.dataset.del}`, {method:'DELETE'}), 'Готово.'));
    } else if (tab === 'orders') {
      const rows = await api('/admin/orders'); const st = ['Приета','Обработва се','Изпратена','Доставена','Отказана'];
      c.innerHTML = `<table><tr><th>№</th><th>Дата</th><th>Клиент</th><th>Доставка</th><th>Артикули</th><th>Сума</th><th>Статус</th></tr>` +
        rows.map(o => `<tr><td>${esc(o.orderNumber)}</td><td>${fmtDate(o.createdAt)}</td><td>${esc(o.customerName)}<br><small>${esc(o.customerPhone)} ${esc(o.customerEmail)}</small></td>
        <td>${esc(o.deliveryCity)}<br><small>${esc(o.deliveryAddress)}</small></td><td>${o.items.map(i => `${i.quantity}× ${esc(i.productName)} <small>(${esc(i.weight)})</small>`).join('<br>')}</td>
        <td><b>${Number(o.totalAmount).toFixed(2)} €</b><br><small>${o.promoCode ? 'код ' + esc(o.promoCode) + ' −' + Number(o.discountAmount).toFixed(2) + ' €' : ''}</small></td>
        <td><select data-status="${o.id}">${st.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('') + `</table>`;
      c.querySelectorAll('[data-status]').forEach(s => s.onchange = () => act(() => api(`/admin/orders/${s.dataset.status}/status`, {method:'PUT', body: JSON.stringify({status: s.value})}), 'Статусът е обновен.'));
    } else if (tab === 'reviews') {
      const rows = await api('/admin/reviews');
      c.innerHTML = `<table><tr><th>Дата</th><th>Автор</th><th>Оценка</th><th>Отзив</th><th>Публикуван</th><th></th></tr>` +
        rows.map(r => `<tr><td>${fmtDate(r.createdAt)}</td><td>${esc(r.authorName)}<br><small>${esc(r.city)}</small></td><td>${'★'.repeat(r.rating)}</td><td>${esc(r.comment)}</td><td>${r.isApproved ? 'Да' : 'Чака'}</td>
        <td>${r.isApproved ? `<button data-hide="${r.id}">Скрий</button>` : `<button class="ok" data-ok="${r.id}">Одобри</button>`} <button class="danger" data-del="${r.id}">Изтрий</button></td></tr>`).join('') + `</table>`;
      c.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => act(() => api(`/admin/reviews/${b.dataset.ok}/approve`, {method:'POST'}), 'Отзивът е публикуван.'));
      c.querySelectorAll('[data-hide]').forEach(b => b.onclick = () => act(() => api(`/admin/reviews/${b.dataset.hide}/hide`, {method:'POST'}), 'Отзивът е скрит.'));
      c.querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirm('Да се изтрие ли отзивът?') && act(() => api(`/admin/reviews/${b.dataset.del}`, {method:'DELETE'}), 'Изтрит.'));
    } else if (tab === 'promocodes') {
      const rows = await api('/admin/promocodes');
      c.innerHTML = `<div class="row"><input id="pc-code" placeholder="КОД"><input id="pc-pct" type="number" min="1" max="100" placeholder="%" style="width:80px"><input id="pc-until" type="date"><button class="primary" id="pc-add">Добави</button></div>
        <table><tr><th>Код</th><th>Отстъпка</th><th>Валиден до</th><th>Активен</th><th></th></tr>` +
        rows.map(p => `<tr><td>${esc(p.code)}</td><td>${p.discountPercent}%</td><td>${p.validUntil ? fmtDate(p.validUntil) : '—'}</td><td>${p.isActive ? 'Да' : 'Не'}</td>
        <td><button data-toggle="${p.id}">${p.isActive ? 'Деактивирай' : 'Активирай'}</button> <button class="danger" data-del="${p.id}">Изтрий</button></td></tr>`).join('') + `</table>`;
      $('#pc-add').onclick = () => act(() => api('/admin/promocodes', {method:'POST', body: JSON.stringify({code: $('#pc-code').value, discountPercent: +$('#pc-pct').value, isActive: true, validUntil: $('#pc-until').value || null})}), 'Кодът е добавен.');
      c.querySelectorAll('[data-toggle]').forEach(b => b.onclick = () => { const p = rows.find(x => x.id == b.dataset.toggle);
        act(() => api(`/admin/promocodes/${p.id}`, {method:'PUT', body: JSON.stringify({code: p.code, discountPercent: p.discountPercent, isActive: !p.isActive, validUntil: p.validUntil})}), 'Обновено.'); });
      c.querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirm('Да се изтрие ли кодът?') && act(() => api(`/admin/promocodes/${b.dataset.del}`, {method:'DELETE'}), 'Изтрит.'));
    }
  } catch (e) { if (e.message !== 'Нужен е вход.') say(e.message, 'err'); }
}

function openProduct(p) {
  editingProductId = p ? p.id : null;
  const f = $('#product-form'); f.reset();
  $('#product-dialog-title').textContent = p ? 'Редакция на продукт' : 'Нов продукт';
  if (p) {
    for (const k of ['name','type','category','origin','tag','image','harvestDate','purity','color','aroma','crystallization','tastingNotes','description']) f.elements[k].value = p[k] ?? '';
    f.elements.beekeeperId.value = p.beekeeper ? p.beekeeper.id : '';
    f.elements.quizTags.value = (p.quizTags || []).join(',');
    f.elements.inStock.checked = p.inStock;
    f.elements.variants.value = p.variants.map(v => `${v.label} | ${v.weight} | ${v.price}`).join('\n');
  }
  $('#product-dialog').showModal();
}
$('#product-form').addEventListener('submit', e => {
  if (e.submitter && e.submitter.value !== 'save') return;
  const f = e.target.elements;
  const variants = f.variants.value.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [label, weight, price] = l.split('|').map(s => s.trim()); return { label, weight, price: parseFloat((price || '').replace(',', '.')), inStock: true }; });
  const body = { beekeeperId: +f.beekeeperId.value, type: f.type.value, name: f.name.value, category: f.category.value, origin: f.origin.value,
    tag: f.tag.value || '100% Натурален', image: f.image.value || './images/acacia.jpg', harvestDate: f.harvestDate.value, purity: f.purity.value, color: f.color.value,
    aroma: f.aroma.value, crystallization: f.crystallization.value, tastingNotes: f.tastingNotes.value, description: f.description.value,
    quizTags: f.quizTags.value, inStock: f.inStock.checked, variants };
  act(() => editingProductId ? api(`/admin/products/${editingProductId}`, {method:'PUT', body: JSON.stringify(body)}) : api('/admin/products', {method:'POST', body: JSON.stringify(body)}), 'Продуктът е записан.');
});

(async () => { try { await api('/auth/me'); showApp(); } catch { showLogin(); } })();
</script>
</body>
</html>
