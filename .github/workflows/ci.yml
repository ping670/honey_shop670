name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore pcheli-diplomenproekt/pcheli-diplomenproekt.Tests/pcheli-diplomenproekt.Tests.csproj
      - name: Build
        run: dotnet build pcheli-diplomenproekt/pcheli-diplomenproekt.Tests/pcheli-diplomenproekt.Tests.csproj -c Release --no-restore
      - name: Test
        run: dotnet test pcheli-diplomenproekt/pcheli-diplomenproekt.Tests/pcheli-diplomenproekt.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/results.trx'
